name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      release_name:
        description: 'Release Name (e.g. Strafe Macro v1.0.0)'
        required: true
        default: 'Strafe Macro v1.0.0'
      draft:
        description: 'Create Draft Release'
        type: boolean
        required: false
        default: false
      prerelease:
        description: 'Create Prerelease'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build Project
        run: cmake --build build --config Release

      - name: Prepare Assets
        shell: pwsh
        run: |
          if (Test-Path "build/Release/StrafeMacro.exe") {
              # Copy to workspace root for release upload
              Copy-Item "build/Release/StrafeMacro.exe" "StrafeMacro.exe"
              Write-Host "StrafeMacro.exe successfully built and prepared."
          } else {
              Write-Error "Build failed: StrafeMacro.exe not found."
              exit 1
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.release_name }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          files: |
            StrafeMacro.exe
          token: ${{ secrets.GITHUB_TOKEN }}
